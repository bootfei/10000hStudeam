<title>ai-studeam</title>
<style>
  /* 布局：Steam 客户端式 —— 顶栏 + 目标条 + 左侧游戏库 + 右侧游戏详情。单一深色世界，刻意不做浅色主题。 */
  :root {
    color-scheme: dark;
    --top: #171a21; --bg: #1b2838; --panel: #16202d; --panel2: #213042; --well: #0e141b;
    --line: #2a475e; --text: #c7d5e0; --dim: #8f98a0; --white: #ffffff; --blue: #66c0f4; --blue2: #417a9b;
    --green1: #75b022; --green2: #588a1b; --gold: #e5b143; --gold2: #b8862b; --red: #e06c5a; --red1: #a83232; --red2: #7a1f1f;
    --purple: #b69cf0;
    --font: "Motiva Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 14px/1.5 var(--font); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 2px; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, textarea, select { font: inherit; background: var(--well); color: var(--text);
    border: 1px solid var(--line); border-radius: 2px; padding: 6px 8px; width: 100%; }

  header { background: var(--top); display: flex; align-items: center; gap: 28px; padding: 0 24px; height: 64px; }
  .logo { font-weight: 800; letter-spacing: 2px; font-size: 20px; color: var(--white); }
  .logo span { color: var(--blue); }
  nav { display: flex; gap: 18px; align-self: stretch; }
  nav button { background: none; color: var(--dim); font-weight: 700; letter-spacing: 1px; font-size: 15px; padding: 0 2px; border-radius: 0; border-bottom: 3px solid transparent; }
  nav button:hover { color: var(--white); }
  nav button.on { color: var(--blue); border-bottom-color: var(--blue); }
  .profile { margin-left: auto; text-align: right; font-size: 12px; color: var(--dim); }
  .profile b { color: var(--white); font-size: 14px; }
  .lvl { display: inline-block; border: 2px solid var(--gold); border-radius: 50%; width: 30px; height: 30px;
    line-height: 26px; text-align: center; color: var(--white); font-weight: 700; margin-left: 10px; vertical-align: middle; }

  .goal { background: linear-gradient(90deg, #1f3a52, var(--bg)); padding: 14px 24px; display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .goal .bar { flex: 1; min-width: 240px; }
  .track { height: 10px; background: var(--well); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--blue2)); }
  .stat { font-size: 12px; color: var(--dim); }
  .stat b { display: block; font-size: 22px; color: var(--white); font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 150px); }
  aside { background: var(--panel); border-right: 1px solid var(--well); }
  aside h3 { margin: 0; padding: 12px 16px; font-size: 12px; color: var(--dim); letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
  aside h3 button { background: none; color: var(--blue); font-size: 20px; line-height: 1; padding: 0 4px; }
  .game { display: flex; align-items: center; gap: 10px; padding: 6px 16px; cursor: pointer; width: 100%; background: none; text-align: left; border-radius: 0; }
  .game:hover { background: var(--panel2); }
  .game.active { background: #3d4450; color: var(--white); }
  .game .ico { width: 24px; height: 24px; border-radius: 2px; display: grid; place-items: center; font-size: 14px; flex: none; }
  .game .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game .h { margin-left: auto; font-size: 12px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .game.running .name::after { content: " · 运行中"; color: var(--green1); font-size: 12px; }

  .hero { height: 180px; position: relative; display: flex; align-items: flex-end; padding: 24px 32px; overflow: hidden; }
  .hero h1 { margin: 0; font-size: 38px; color: var(--white); text-shadow: 0 2px 8px rgba(0,0,0,.6); position: relative; text-wrap: balance; }
  .hero .emoji { position: absolute; right: 40px; top: 16px; font-size: 120px; opacity: .25; }
  .playbar { background: rgba(0,0,0,.35); display: flex; align-items: center; gap: 28px; padding: 16px 32px; flex-wrap: wrap; }
  .play { background: linear-gradient(90deg, var(--green1), var(--green2)); color: var(--white); font-size: 20px;
    font-weight: 700; padding: 10px 36px; letter-spacing: 1px; }
  .play.stop { background: linear-gradient(90deg, #4c7fa6, #2d5674); }
  .play:hover:not(:disabled), .boss:hover, .ok:hover, .no:hover, .ai:hover:not(:disabled) { filter: brightness(1.15); }
  .ghost { background: #3d4c5d; color: var(--text); padding: 6px 12px; font-size: 13px; }
  .ghost:hover { background: #4b5d72; color: var(--white); }
  .link { background: none; color: var(--dim); text-decoration: underline; padding: 0; font-size: 12px; }
  .link:hover { color: var(--white); }
  .ai { background: linear-gradient(90deg, #6b4fbb, #4a3590); color: var(--white); padding: 6px 12px; font-size: 13px; }
  .content { padding: 24px 32px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
  .col { display: grid; gap: 24px; min-width: 0; }
  .card { background: rgba(0,0,0,.2); padding: 16px; min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: 1px; color: var(--white); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dlc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; background: var(--panel2); margin-bottom: 4px; }
  .dlc .t { color: var(--white); }
  .dlc .m { color: var(--dim); font-size: 12px; white-space: pre-wrap; }
  .dlc .d { grid-row: span 2; align-self: center; color: var(--blue); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--dim); text-align: center; padding: 36px 20px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 22px; color: var(--green1); display: block; }

  .achsum { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; }
  .achsum .track { flex: 1; }
  .achsum .fill { background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  .ach { display: flex; gap: 12px; align-items: center; padding: 8px 10px; background: var(--panel2); margin-bottom: 4px; flex-wrap: wrap; }
  .ach .badge { width: 44px; height: 44px; display: grid; place-items: center; background: var(--well); border: 1px solid var(--line); font-size: 22px; flex: none; filter: grayscale(1); opacity: .5; }
  .ach.got .badge { filter: none; opacity: 1; border-color: var(--gold); box-shadow: 0 0 8px rgba(229,177,67,.35); }
  .ach .info { flex: 1; min-width: 160px; }
  .ach .title { color: var(--white); }
  .ach:not(.got) .title { color: var(--dim); }
  .ach .sub { font-size: 12px; color: var(--dim); }
  .ach .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .boss { background: linear-gradient(90deg, var(--red1), var(--red2)); color: var(--white); padding: 6px 12px; font-size: 13px; font-weight: 700; }
  .qlist { margin: 0 0 10px 56px; font-size: 12px; }
  .qrow { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid #22303f; align-items: baseline; }
  .qrow .qt { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qrow .qs { flex: none; color: var(--dim); font-variant-numeric: tabular-nums; }
  .qbar { display: flex; gap: 14px; flex-wrap: wrap; padding-top: 8px; align-items: center; }
  .by { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 2px; flex: none; }
  .by.me { background: rgba(102,192,244,.15); color: var(--blue); }
  .by.claude { background: rgba(182,156,240,.15); color: var(--purple); }
  .mini { display: flex; gap: 10px; align-items: center; padding: 5px 0; opacity: .35; font-size: 13px; }
  .mini.got { opacity: 1; }
  .mini .badge { width: 30px; height: 30px; display: grid; place-items: center; background: var(--well); border: 1px solid var(--line); }
  .mini .t { color: var(--white); }
  .split { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); padding: 4px 0; }
  .split b { color: var(--white); font-variant-numeric: tabular-nums; }

  dialog { background: var(--panel2); color: var(--text); border: 1px solid var(--line); padding: 24px; width: min(480px, 92vw); max-height: 90vh; overflow: auto; }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog h2 { margin-top: 0; color: var(--white); font-size: 18px; }
  dialog label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--dim); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; align-items: center; flex-wrap: wrap; }
  .ok { background: linear-gradient(90deg, var(--green1), var(--green2)); color: var(--white); padding: 8px 18px; }
  .no { background: linear-gradient(90deg, var(--red1), var(--red2)); color: var(--white); padding: 8px 18px; }
  #quizDlg, #genDlg, dialog.wide { width: min(640px, 94vw); }
  .qhead { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
  .qdots { display: flex; gap: 4px; margin: 8px 0 16px; }
  .qdots i { flex: 1; height: 4px; background: var(--well); }
  .qdots i.r { background: var(--green1); } .qdots i.w { background: var(--red); } .qdots i.c { background: var(--blue); }
  .qtext { font-size: 16px; color: var(--white); white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); background: var(--well); padding: 14px; border-left: 3px solid var(--blue); }
  .qans { margin-top: 12px; padding: 12px 14px; background: rgba(117,176,34,.1); border-left: 3px solid var(--green1); white-space: pre-wrap; overflow-wrap: anywhere; }
  .qans b, .qai b { display: block; font-size: 12px; margin-bottom: 4px; }
  .qans b { color: var(--green1); }
  .qai { margin-top: 12px; padding: 12px 14px; background: rgba(182,156,240,.1); border-left: 3px solid var(--purple); white-space: pre-wrap; }
  .qai b { color: var(--purple); }
  .verdict { font-weight: 700; }
  .verdict.right { color: var(--green1); } .verdict.partial { color: var(--gold); } .verdict.wrong { color: var(--red); }
  .qsrc { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .result { text-align: center; padding: 10px 0; }
  .result .big { font-size: 48px; }
  .result h3 { color: var(--white); margin: 8px 0; font-size: 22px; }
  .cand { display: flex; gap: 10px; padding: 10px; background: var(--well); margin-bottom: 6px; align-items: flex-start; }
  .cand input { width: auto; margin-top: 4px; }
  .cand .q { color: var(--white); white-space: pre-wrap; font-family: var(--mono); font-size: 13px; }
  .cand .a { color: var(--dim); font-size: 12px; white-space: pre-wrap; margin-top: 4px; }
  .note { font-size: 12px; color: var(--dim); }
  .err { color: var(--red); font-size: 13px; }

  #toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 10; }
  .toast { display: flex; gap: 12px; align-items: center; width: min(300px, calc(100vw - 32px)); padding: 12px; color: var(--white);
    background: linear-gradient(135deg, var(--line), var(--bg)); border: 1px solid #3c6a8a; box-shadow: 0 6px 20px rgba(0,0,0,.5);
    animation: slide .35s ease-out, fade .5s ease-in 5s forwards; }
  .toast .badge { width: 48px; height: 48px; display: grid; place-items: center; font-size: 26px; background: var(--well); border: 1px solid var(--gold); flex: none; }
  .toast small { display: block; color: var(--dim); font-size: 11px; }
  @keyframes slide { from { transform: translateY(120%); opacity: 0; } }
  @keyframes fade { to { opacity: 0; transform: translateY(20px); } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* calendar */
  .calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding: 24px 32px; align-items: start; }
  .calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .calhead h2 { margin: 0; flex: 1; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .wd { font-size: 12px; color: var(--dim); text-align: center; padding: 4px 0; }
  .cell { min-height: 78px; background: var(--panel2); padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent; position: relative; border-radius: 2px; min-width: 0; }
  .cell:hover { border-color: var(--line); }
  .cell.out { opacity: .35; }
  .cell.today { border-color: var(--blue); }
  .cell.sel { outline: 2px solid var(--white); outline-offset: -1px; }
  .cell.rest { background: #1d2533; }
  .cell.pass { background: linear-gradient(180deg, rgba(117,176,34,.22), var(--panel2)); }
  .cell .n { font-size: 12px; color: var(--dim); }
  .cell.today .n { color: var(--blue); font-weight: 700; }
  .cell .hrs { font-size: 13px; color: var(--white); font-variant-numeric: tabular-nums; }
  .cell .heat { height: 4px; background: var(--well); display: block; }
  .cell .heat i { display: block; height: 100%; background: var(--green1); }
  .cell .dots { display: flex; gap: 3px; }
  .cell .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--well); }
  .cell .dots i.on { background: var(--green1); }
  .cell .cico { position: absolute; right: 5px; top: 3px; font-size: 14px; }
  .cell .tag { font-size: 11px; color: var(--gold); }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--well); color: var(--dim); letter-spacing: 0; font-weight: 400; white-space: nowrap; }
  .pill.ok { background: rgba(117,176,34,.2); color: var(--green1); }
  .pill.rest { background: rgba(229,177,67,.15); color: var(--gold); }
  .task { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid #22303f; }
  .task input { width: auto; margin-top: 4px; }
  .task .tt { flex: 1; min-width: 0; display: grid; overflow-wrap: anywhere; cursor: pointer; }
  .task .done { text-decoration: line-through; color: var(--dim); }
  .taskadd { display: grid; gap: 6px; margin-top: 10px; }
  .weekbar { display: grid; gap: 8px; margin-top: 12px; }
  .wpday { font-size: 14px; color: var(--white); margin: 16px 0 6px; display: flex; justify-content: space-between; gap: 8px; }

  footer { padding: 12px 24px; display: flex; gap: 8px; background: var(--top); font-size: 12px; color: var(--dim); align-items: center; flex-wrap: wrap; }
  #banner { background: #3a2a14; color: var(--gold); padding: 10px 24px; font-size: 13px; }

  @media (max-width: 860px) {
    header { padding: 0 16px; gap: 16px; }
    .goal { padding: 14px 16px; }
    main { grid-template-columns: minmax(0, 1fr); }
    aside { border-right: 0; }
    .content { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .hero { padding: 16px; height: 140px; }
    .hero h1 { font-size: 26px; }
    .playbar { padding: 16px; gap: 16px; }
    nav { gap: 12px; } nav button { font-size: 14px; }
    .logo { font-size: 16px; }
    .calwrap { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .cell { min-height: 54px; padding: 4px; }
    .cell .hrs { font-size: 11px; }
    .qlist { margin-left: 0; }
    footer { padding: 12px 16px; }
  }
</style>

<header>
  <div class="logo">STUDY<span>STEAM</span></div>
  <nav><button data-view="lib">库</button><button data-view="cal">日历</button></nav>
  <div class="profile" id="profile"></div>
</header>
<div id="banner" hidden></div>
<section class="goal" id="goal"></section>
<main id="libView">
  <aside>
    <h3>游戏库（科目）<button id="addGame" title="添加游戏" aria-label="添加游戏">＋</button></h3>
    <div id="list"></div>
  </aside>
  <section id="detail"></section>
</main>
<section id="calView" hidden></section>
<footer>
  <button class="ghost" id="exportBtn">导出存档 JSON</button>
  <button class="ghost" id="importBtn">导入存档</button>
  <button class="ghost" id="goalBtn">设置目标 / 起始日期</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <span style="margin-left:auto" id="syncNote">存档保存在云端</span>
</footer>
<div id="toasts"></div>

<dialog id="askDlg"><form id="askForm"></form></dialog>
<dialog id="quizDlg"><div id="quizBody"></div></dialog>
<dialog id="genDlg"><div id="genBody"></div></dialog>
<dialog id="dqDlg" class="wide"><div id="dqBody"></div></dialog>
<dialog id="tsDlg" class="wide"><div id="tsBody"></div></dialog>
<dialog id="wpDlg" class="wide"><div id="wpBody"></div></dialog>

<script>
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));

const HOUR_ACHIEVEMENTS = [
  [1, '🐣', '新手村', '累计 1 小时'],
  [10, '🔥', '上手了', '累计 10 小时'],
  [50, '⚔️', '小有所成', '累计 50 小时'],
  [100, '🏅', '百小时俱乐部', '累计 100 小时'],
  [500, '💎', '硬核玩家', '累计 500 小时'],
  [1000, '👑', '千锤百炼', '累计 1000 小时'],
];
const WARMUP_SIZE = 3;
const DEFAULT_SETTINGS = { start: '2026-11-01', running: null, dailyTargetMin: 60, weekdayTargetMin: { 6: 300 }, restDays: [0], quizCount: 3, quizPass: 2, goals: [
  { name: '硕士期间', hours: 1000, years: 2 },
  { name: '终极目标', hours: 10000, years: 7 },
]};

// ---------- state（云端为准，本地只是镜像） ----------
let db = null, sample = null, downloads = null;
let games = [];                 // [{id, name, emoji, color, created, chapters, dlcs}]
let settings = clone(DEFAULT_SETTINGS);
let loaded = { games: false, settings: false };
let readOnly = false;
let selected = null, view = 'lib';
try { view = localStorage.getItem('study-steam-view') || 'lib'; } catch (e) {}
try { selected = localStorage.getItem('study-steam-selected'); } catch (e) {}
const select = id => { selected = id; try { localStorage.setItem('study-steam-selected', id || ''); } catch (e) {} };

// 每个文档一次只写一个：排队，写入时取最新内容
const queues = {};
function put(path, getData) {
  if (!db || readOnly) return;
  queues[path] = (queues[path] || Promise.resolve()).then(async () => {
    const data = getData();
    try {
      if (data === null) await db.doc(path).delete();
      else await db.doc(path).set(data);
    } catch (e) { onWriteError(e); }
  });
}
// 弹窗等待期间云端快照可能替换了 games 里的对象，所以以传入的 g 为准，并放回本地镜像
const saveGame = g => {
  if (game(g.id) !== g) games = games.filter(x => x.id !== g.id).concat(g);
  put('games/' + g.id, () => { const { id: _, ...body } = g; return clone(body); });
};
const deleteGame = id => put('games/' + id, () => null);
const saveSettings = () => put('meta/settings', () => clone(settings));

function onWriteError(e) {
  if (e?.code === 'invalid_argument') { readOnly = true; showBanner('你没有修改这个存档的权限，页面现在是只读的。'); }
  else if (e?.code === 'quota_exceeded') showBanner('云端存档已满，先导出备份，再删除一些旧 DLC。');
  else showBanner('保存失败（' + (e?.code || '未知') + '），刷新页面后再试。');
}
function showBanner(msg) { const b = $('#banner'); b.textContent = msg; b.hidden = !msg; }

// ---------- derived ----------
const mins = g => g.dlcs.reduce((a, d) => a + d.minutes, 0);
const totalMins = () => games.reduce((a, g) => a + mins(g), 0);
const fmtH = m => (m / 60).toFixed(1);
const recentMins = (g, days = 14) => {
  const d = new Date(Date.now() - days * 864e5);
  const cut = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  return g.dlcs.filter(x => x.date >= cut).reduce((a, x) => a + x.minutes, 0);
};
const lastPlayed = g => g.dlcs.reduce((a, d) => d.date > a ? d.date : a, '');
const level = m => Math.floor(Math.sqrt(m / 60)); // 1h→1, 100h→10, 10000h→100
const game = id => games.find(g => g.id === id);
const chapter = (g, id) => g?.chapters.find(c => c.id === id);
const question = (c, id) => c?.questions.find(q => q.id === id);
const accuracy = qs => { const r = qs.reduce((a, q) => a + q.right, 0), t = qs.reduce((a, q) => a + q.right + q.wrong, 0); return t ? Math.round(r / t * 100) + '%' : '—'; };
const byTag = by => by === 'me' ? '<span class="by me">我</span>' : '<span class="by claude">Claude</span>';

// ---------- in-page dialogs（查看器里没有 alert/confirm/prompt） ----------
function ask({ title, body = '', fields = [], ok = '确定', danger = false, cancel = '取消' }) {
  return new Promise(resolve => {
    const f = $('#askForm');
    f.innerHTML = `<h2>${esc(title)}</h2>${body ? `<p>${esc(body)}</p>` : ''}
      ${fields.map((x, i) => `<label for="ask_${i}">${esc(x.label)}</label>${x.type === 'textarea'
        ? `<textarea id="ask_${i}" name="${x.name}" rows="${x.rows || 4}" ${x.required ? 'required' : ''} placeholder="${esc(x.placeholder || '')}">${esc(x.value || '')}</textarea>`
        : `<input id="ask_${i}" name="${x.name}" type="${x.type || 'text'}" value="${esc(x.value ?? '')}" ${x.required ? 'required' : ''} ${x.min != null ? `min="${x.min}"` : ''} maxlength="${x.max || 200}" placeholder="${esc(x.placeholder || '')}" ${x.type === 'color' ? 'style="height:36px;padding:2px"' : ''}>`}`).join('')}
      <div class="row"><button type="button" class="ghost" data-cancel>${esc(cancel)}</button><button class="${danger ? 'no' : 'ok'}">${esc(ok)}</button></div>`;
    const dlg = $('#askDlg');
    let done = false;
    const finish = v => { if (done) return; done = true; dlg.close(); resolve(v); };
    f.onsubmit = e => { e.preventDefault(); finish(Object.fromEntries(new FormData(f))); };
    f.querySelector('[data-cancel]').onclick = () => finish(null);
    dlg.oncancel = e => { e.preventDefault(); finish(null); };
    dlg.showModal();
    f.querySelector('input,textarea')?.focus();
  });
}

// ---------- quiz ----------
// mode: 'warmup'（开始游戏前热身，结束后计时）| 'boss'（章节考核，全对解锁）
// 只存 id，每次从最新的 games 里取，避免云端快照替换对象后改到旧副本
let quiz = null;

function warmupPool(g) {
  const firstTodo = g.chapters.find(c => !c.done);
  return g.chapters.filter(c => c.done || c === firstTodo).flatMap(c => c.questions.map(q => ({ c, q })));
}
function pickWeighted(pool, n) {
  const items = pool.map(it => ({ it, w: Math.max(0.2, 1 + it.q.wrong * 2 - it.q.right * 0.5) }));
  const out = [];
  while (out.length < n && items.length) {
    let r = Math.random() * items.reduce((a, x) => a + x.w, 0);
    const i = items.findIndex(x => (r -= x.w) <= 0);
    out.push(items.splice(i < 0 ? items.length - 1 : i, 1)[0].it);
  }
  return out;
}
const freshGrade = () => ({ status: 'idle', verdict: null, feedback: '', ctl: null });

function startQuiz(mode, g, c) {
  const items = (mode === 'boss' ? shuffle(c.questions.map(q => ({ c, q }))) : pickWeighted(warmupPool(g), WARMUP_SIZE))
    .map(({ c, q }) => ({ cid: c.id, qid: q.id }));
  if (!items.length) { if (mode === 'warmup') startTimer(g, null); return; }
  quiz = { mode, gameId: g.id, chapterId: c?.id, wasDone: !!c?.done, items, i: 0, results: [], revealed: false, draft: '', grade: freshGrade() };
  renderQuiz();
  $('#quizDlg').showModal();
}

function renderQuiz() {
  const g = game(quiz.gameId);
  if (!g) { closeQuiz(); return; }
  const dots = quiz.items.map((_, i) => `<i class="${quiz.results[i] === true ? 'r' : quiz.results[i] === false ? 'w' : i === quiz.i ? 'c' : ''}"></i>`).join('');
  const label = quiz.mode === 'boss' ? `⚔ BOSS 战 · ${esc(chapter(g, quiz.chapterId)?.name)}` : `🔥 开局热身 · ${esc(g.name)}`;

  if (quiz.i >= quiz.items.length) {
    const right = quiz.results.filter(Boolean).length, n = quiz.items.length;
    let html;
    if (quiz.mode === 'boss') {
      const win = right === n;
      html = `<div class="result"><div class="big">${win ? '🏆' : '💀'}</div>
        <h3>${win ? (quiz.wasDone ? '复习全对' : 'Boss 已击败！') : `还差 ${n - right} 题`}</h3>
        <p>${right} / ${n} 题答对${win ? '' : '。把答错的题弄懂，下次再战。'}</p></div>
        <div class="row"><button class="ok" data-q="close">${win && !quiz.wasDone ? '收下成就' : '知道了'}</button></div>`;
    } else {
      html = `<div class="result"><div class="big">🎮</div><h3>热身完成</h3><p>${right} / ${n} 题答对，开始计时吧。</p></div>
        <div class="row"><button class="link" data-q="close">先不玩了</button><button class="play" data-q="go">▶ 开始计时</button></div>`;
    }
    $('#quizBody').innerHTML = `<div class="qhead"><span>${label}</span></div><div class="qdots">${dots}</div>${html}`;
    return;
  }

  const it = quiz.items[quiz.i];
  const c = chapter(g, it.cid), q = question(c, it.qid);
  if (!q) { quiz.items.splice(quiz.i, 1); renderQuiz(); return; } // 题被删了，跳过
  const gr = quiz.grade;
  const verdictText = { right: '答对了', partial: '部分正确', wrong: '没答对' };
  $('#quizBody').innerHTML = `
    <div class="qhead"><span>${label}</span><span>${quiz.i + 1} / ${quiz.items.length}</span></div>
    <div class="qdots">${dots}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="qsrc">${byTag(q.by)} 出自：${esc(c.name)} · 历史 ✓${q.right} ✗${q.wrong}</div>
    <label for="draft" style="margin-top:14px">先自己答，写下来再看答案</label>
    <textarea id="draft" rows="3" ${quiz.revealed || gr.status === 'loading' ? 'readonly' : ''}>${esc(quiz.draft)}</textarea>
    ${gr.status === 'loading' ? `<div class="qai"><b>Claude 批改</b>Claude 思考中… <button class="link" data-q="stopGrade">停止</button></div>` : ''}
    ${gr.status === 'done' ? `<div class="qai"><b>Claude 批改 · <span class="verdict ${gr.verdict}">${verdictText[gr.verdict] || ''}</span></b>${esc(gr.feedback)}</div>` : ''}
    ${gr.status === 'error' ? `<div class="qai"><b>Claude 批改</b><span class="err">${esc(gr.feedback)}</span></div>` : ''}
    ${quiz.revealed ? `<div class="qans"><b>参考答案</b>${esc(q.a)}</div>` : ''}
    <div class="row">
      <button class="link" data-q="close" style="margin-right:auto">退出</button>
      ${quiz.revealed
        ? `<button class="no" data-q="wrong">✗ 没答对</button><button class="ok" data-q="right">✓ 答对了</button>`
        : `${sample ? `<button class="ai" data-q="grade" ${gr.status === 'loading' ? 'disabled' : ''}>✨ 让 Claude 批改</button>` : ''}<button class="ghost" data-q="reveal" style="padding:8px 18px">揭晓答案</button>`}
    </div>`;
  if (!quiz.revealed && gr.status !== 'loading') setTimeout(() => $('#draft')?.focus(), 0);
}

const SAMPLE_ERR = {
  not_granted: '你没有允许这个页面使用 Claude。', sampling_disabled: '这个账号不能使用 Claude。',
  rate_limited: '调用太频繁或额度用完了，稍后再试。', session_expired: '登录已过期，请重新登录 claude.ai。',
  refused: 'Claude 拒绝回答这个输入。', invalid_json: 'Claude 的回复格式不对，再试一次。',
};
const sampleErr = e => SAMPLE_ERR[e?.code] || 'Claude 暂时没有回应，再试一次。';
const hideSampleIfDenied = e => { if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e?.code)) { sample = null; render(); } };

function claudeGrade({ subject, chapter, q, a, answer, signal }) {
  return sample.json(
`你在批改一道简答题。判断学习者的回答是否抓住了参考答案的要点：措辞不同没关系，但关键的数值、形状、原因必须对。

科目：${subject}
章节：${chapter}
题目：
${q}

参考答案：
${a}

学习者的回答：
${answer}

只回复一个 JSON 对象：{"verdict": "right" | "partial" | "wrong", "feedback": "一到三句中文点评：对在哪里、错在哪里、漏了什么"}`,
    { signal }).then(r => ({ verdict: ['right', 'partial', 'wrong'].includes(r?.verdict) ? r.verdict : null, feedback: String(r?.feedback || '') }));
}

async function gradeCurrent() {
  const g = game(quiz.gameId), it = quiz.items[quiz.i];
  const c = chapter(g, it.cid), q = question(c, it.qid);
  quiz.draft = $('#draft').value;
  if (!quiz.draft.trim()) { quiz.grade = { ...freshGrade(), status: 'error', feedback: '先写下你的答案，再让 Claude 批改。' }; renderQuiz(); return; }
  const ctl = new AbortController();
  const token = quiz;
  quiz.grade = { status: 'loading', verdict: null, feedback: '', ctl };
  renderQuiz();
  try {
    const r = await claudeGrade({ subject: g.name, chapter: c.name, q: q.q, a: q.a, answer: quiz.draft, signal: ctl.signal });
    if (quiz !== token) return;
    quiz.grade = { status: 'done', verdict: r.verdict, feedback: r.feedback, ctl: null };
    quiz.revealed = true;
  } catch (e) {
    if (quiz !== token) return;
    quiz.grade = e?.code === 'cancelled' ? freshGrade() : { ...freshGrade(), status: 'error', feedback: sampleErr(e) };
    hideSampleIfDenied(e);
  }
  renderQuiz();
}

function closeQuiz() { quiz?.grade?.ctl?.abort(); quiz = null; if ($('#quizDlg').open) $('#quizDlg').close(); render(); }

$('#quizBody').addEventListener('click', e => {
  const act = e.target.closest('[data-q]')?.dataset.q; if (!act || !quiz) return;
  const g = game(quiz.gameId);
  if (act === 'grade') return gradeCurrent();
  if (act === 'stopGrade') { quiz.grade.ctl?.abort(); return; }
  if (act === 'reveal') { quiz.draft = $('#draft').value; quiz.revealed = true; }
  if (act === 'right' || act === 'wrong') {
    const ok = act === 'right';
    const it = quiz.items[quiz.i];
    const c = chapter(g, it.cid), q = question(c, it.qid);
    if (q) q[ok ? 'right' : 'wrong']++;
    quiz.results.push(ok); quiz.i++; quiz.revealed = false; quiz.draft = ''; quiz.grade = freshGrade();
    if (quiz.i >= quiz.items.length && quiz.mode === 'boss' && quiz.results.every(Boolean)) {
      const bc = chapter(g, quiz.chapterId);
      if (bc && !bc.done) unlock(g, bc);
    }
    saveGame(g);
  }
  if (act === 'go') {
    const r = quiz.results.filter(Boolean).length, n = quiz.items.length;
    quiz = null; $('#quizDlg').close(); startTimer(g, `热身 ${r}/${n}`); return;
  }
  if (act === 'close') return closeQuiz();
  renderQuiz();
});
$('#quizDlg').addEventListener('cancel', e => { e.preventDefault(); closeQuiz(); });

function startTimer(g, warmup) {
  settings.running = { gameId: g.id, start: Date.now(), warmup };
  saveSettings(); render();
}

    ${gen.status === 'loading' ? `<p class="note">Claude 思考中，通常要十几秒到一分钟… <button class="link" data-g="stop">停止</button></p>` : ''}
    ${gen.status === 'error' ? `<p class="err">${esc(gen.error)}</p>` : ''}
    ${gen.items.length ? `<label>勾选要加入题库的题</label>${gen.items.map((x, i) => `
      <label class="cand" for="cand_${i}" style="margin:0 0 6px"><input type="checkbox" id="cand_${i}" data-i="${i}" ${x.pick ? 'checked' : ''}>
        <span><div class="q">${esc(x.q)}</div><div class="a">参考答案：${esc(x.a)}</div></span></label>`).join('')}` : ''}
    <div class="row">
      <button class="link" data-g="close" style="margin-right:auto">关闭</button>
      <button class="ai" data-g="run" ${gen.status === 'loading' ? 'disabled' : ''}>${gen.items.length ? '换一批' : '出 3 道题'}</button>
      ${gen.items.length ? `<button class="ok" data-g="add" ${gen.items.some(x => x.pick) ? '' : 'disabled'}>加入题库</button>` : ''}
    </div>`;
}

async function runGen() {
  const g = game(gen.gameId), c = chapter(g, gen.cid);
  gen.hint = $('#genHint').value.trim();
  const ctl = new AbortController();
  const token = gen;
  Object.assign(gen, { status: 'loading', error: '', ctl });
  renderGen();
  const existing = c.questions.map(q => '- ' + q.q.replace(/\n/g, ' ')).join('\n') || '（暂无）';
  const weak = c.questions.filter(q => q.wrong > q.right).map(q => '- ' + q.q.replace(/\n/g, ' ')).join('\n');
  const doneChapters = g.chapters.filter(x => x.done).map(x => x.name).join('、') || '（暂无）';
  try {
    const r = await sample.json(
`你是一位严格但友善的出题老师。学习者背景：10 年 Java 后端工程师，正在转型大模型后训练 / RL 系统方向，同时在读 AI 在职硕士。

请为下面这一章出 3 道新题。
科目：${g.name}
章节：${c.name}
已完成的章节：${doneChapters}
${gen.hint ? '学习者希望的侧重点：' + gen.hint + '\n' : ''}
题库里已有的题（不要重复，也不要换个说法重复）：
${existing}
${weak ? '\n学习者答错较多的题（可以换一个角度再考同一个知识点）：\n' + weak + '\n' : ''}
要求：
- 简答题，1 到 3 分钟内能用几句话、一个式子或一个形状答出。
- 优先考“结果的形状 / 数值是多少 / 每个位置从哪来 / 为什么”，少考纯名词记忆。
- 不要出需要写完整代码的题；需要时可以在题目里给出几行代码让学习者推结果。
- 参考答案简洁准确，1 到 3 句。拿不准的知识点不要出。
- 用中文，代码和张量写法保持原样。

只回复一个 JSON 数组：[{"q": "题目", "a": "参考答案"}, ...]`,
      { signal: ctl.signal, cache: false });
    if (gen !== token) return;
    const items = (Array.isArray(r) ? r : []).filter(x => x && typeof x.q === 'string' && typeof x.a === 'string' && x.q.trim())
      .slice(0, 5).map(x => ({ q: x.q.trim(), a: x.a.trim(), pick: true }));
    Object.assign(gen, { status: items.length ? 'idle' : 'error', error: items.length ? '' : 'Claude 没给出可用的题，再试一次。', items, ctl: null });
  } catch (e) {
    if (gen !== token) return;
    Object.assign(gen, { status: e?.code === 'cancelled' ? 'idle' : 'error', error: sampleErr(e), ctl: null });
    hideSampleIfDenied(e);
  }
  if (gen === token) renderGen();
}

      ]});

      saveGame(g); break;
    }
    case 'delDlc': {

      g.dlcs = g.dlcs.filter(x => x !== d); saveGame(g); break;
    }

      if (!await ask({ title: `移除「${g.name}」？`, body: `它的 ${g.dlcs.length} 个 DLC、${g.chapters.length} 个章节和全部题目都会删除。可以先导出存档备份。`, ok: '移除', danger: true })) return;
      games = games.filter(x => x !== g);
      if (settings.running?.gameId === g.id) { settings.running = null; saveSettings(); }
      deleteGame(g.id); select(games[0]?.id || null); break;
    }
    case 'addCh': {
      const r = await ask({ title: '添加章节', ok: '添加', fields: [{ name: 'name', label: '章节名称', required: true, placeholder: '例如：机器学习基础 / 2. 形状与数值' }] });
      if (!r) return;
      g.chapters.push({ id: uid(), name: r.name.trim(), done: false, doneDate: null, questions: [] }); saveGame(g); break;
    }
    case 'renameCh': {
      const r = await ask({ title: '章节改名', ok: '保存', fields: [{ name: 'name', label: '章节名称', required: true, value: c.name }] });
      if (!r) return;
      c.name = r.name.trim(); saveGame(g); break;
    }
    case 'delCh': {
      if (!await ask({ title: `删除章节「${c.name}」？`, body: `它的 ${c.questions.length} 道题也会删除。`, ok: '删除', danger: true })) return;
      g.chapters = g.chapters.filter(x => x !== c); saveGame(g); break;
    }
    case 'boss': return startQuiz('boss', g, c);
    case 'mark': unlock(g, c); saveGame(g); break;
    case 'unmark': c.done = false; c.doneDate = null; saveGame(g); break;
    case 'toggleQ': expanded = expanded === c.id ? null : c.id; return renderDetail();
    case 'addQ': {
      const r = await ask({ title: '我来出题', body: `章节：${c.name}`, ok: '加入题库', fields: [
        { name: 'q', label: '题目', type: 'textarea', required: true, placeholder: '例如：x.sum(dim=1, keepdim=True).shape = ?' },
        { name: 'a', label: '参考答案', type: 'textarea', required: true },
      ]});
      if (!r) return;
      c.questions.push({ id: uid(), q: r.q.trim(), a: r.a.trim(), by: 'me', right: 0, wrong: 0 }); saveGame(g); break;
    }
    case 'genQ':
      gen = { gameId: g.id, cid: c.id, hint: '', items: [], status: 'idle', error: '', ctl: null };
      renderGen(); $('#genDlg').showModal(); return;
    case 'delQ': {
      const q = question(c, btn.dataset.q);
      if (!q || !await ask({ title: '删除这道题？', body: q.q, ok: '删除', danger: true })) return;
      c.questions = c.questions.filter(x => x !== q); saveGame(g); break;
    }
  }
  render();
});

// ---------- 日历：每日关卡 ----------
// 每天三个条件：时长达标、任务全部勾完、每日测验通过（Claude 出题 + Claude 批改）。主日不设目标，也不打断连续天数。
let days = {};          // date -> {date, targetMin, tasks, attempts}
let calMonth = today().slice(0, 7), calSel = today();
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const weekday = date => new Date(date + 'T00:00:00').getDay();
const isRest = date => (settings.restDays || []).includes(weekday(date));
const addDays = (date, n) => { const d = new Date(date + 'T00:00:00'); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const dayMins = date => games.reduce((a, g) => a + g.dlcs.filter(d => d.date === date).reduce((s, d) => s + d.minutes, 0), 0);
// 当天目标：主日为 0；按星期几单独设置的优先，其余用每日默认值
const targetFor = date => isRest(date) ? 0 : (settings.weekdayTargetMin?.[weekday(date)] ?? settings.dailyTargetMin);
const targetDesc = () => [1, 2, 3, 4, 5, 6].filter(w => !(settings.restDays || []).includes(w))
  .map(w => `周${WEEK[w]} ${fmtH(settings.weekdayTargetMin?.[w] ?? settings.dailyTargetMin)} 小时`).join('，');
const ensureDay = date => days[date] || { date, targetMin: targetFor(date), tasks: [], attempts: [] };
const saveDay = d => { days[d.date] = d; put('days/' + d.date, () => { const { date: _, ...body } = d; return clone(body); }); };

function dayStatus(date) {
  const d = days[date];
  const rest = isRest(date);
  const target = rest ? 0 : (d?.targetMin ?? targetFor(date));
  const minutes = dayMins(date);
  const tasks = d?.tasks || [];
  const timeOk = minutes >= target;
  const tasksOk = tasks.length > 0 && tasks.every(t => t.done);
  const quizOk = (d?.attempts || []).some(a => a.passed);
  return { rest, target, minutes, tasks, timeOk, tasksOk, quizOk, passed: !rest && timeOk && tasksOk && quizOk };
}

function streak() {
  let date = today(), n = 0;
  if (!dayStatus(date).passed) date = addDays(date, -1);
  for (let k = 0; k < 3650; k++, date = addDays(date, -1)) {
    const s = dayStatus(date);
    if (s.rest) continue;
    if (!s.passed) break;
    n++;
  }
  return n;
}

function renderDayPanel(date) {
  const s = dayStatus(date), t = today();
  const isToday = date === t, future = date > t;
  const title = `${+date.slice(5, 7)} 月 ${+date.slice(8)} 日 · 周${WEEK[weekday(date)]}`;
  const dl = games.flatMap(g => g.dlcs.filter(d => d.date === date).map(d => ({ g, d })));
  const dlHtml = dl.map(({ g, d }) => `<div class="split"><span>${esc(g.emoji)} ${esc(g.name)} · ${esc(d.name)}</span><b>${fmtH(d.minutes)}h</b></div>`).join('');
  if (s.rest) return `<div class="col"><div class="card"><h2>${title}<span class="pill rest">主日</span></h2>
    <p>今天是主日，安息敬拜。不设学习目标，也不影响连续通关天数。</p>${dlHtml}</div></div>`;
  const pill = ok => `<span class="pill ${ok ? 'ok' : ''}">${ok ? '✓ 达成' : '未达成'}</span>`;
  const attempts = days[date]?.attempts || [];
  const last = attempts[attempts.length - 1];
  const inProgress = last && !last.done;
  const chapterOpts = games.flatMap(g => g.chapters.map(c => `<option value="${g.id}|${c.id}">${esc(g.name)} / ${esc(c.name)}</option>`)).join('');
  return `<div class="col">
    <div class="card"><h2>${title}${s.passed ? '<span class="pill ok">🏆 今日通关</span>' : future ? '<span class="pill">计划中</span>' : ''}</h2>
      <div class="note">连续通关 <b style="color:var(--white)">${streak()}</b> 天</div></div>
    <div class="card"><h2>① 时长 ${fmtH(s.minutes)} / ${fmtH(s.target)} h ${pill(s.timeOk)}</h2>
      <div class="track"><div class="fill" style="width:${s.target ? Math.min(100, s.minutes / s.target * 100) : 100}%"></div></div>
      <div style="margin-top:8px">${dlHtml || '<div class="note">这一天还没有 DLC 记录。时长来自游戏库里记的 DLC。</div>'}</div>
      ${isToday ? '<div class="qbar"><button class="ghost" data-c="goLib">去游戏库开始游戏</button></div>' : ''}
    </div>
    <div class="card"><h2>② 任务 ${s.tasks.filter(x => x.done).length} / ${s.tasks.length} ${pill(s.tasksOk)}</h2>

        const g = game(tk.gameId), c = chapter(g, tk.chapterId);
        return `<div class="task"><input type="checkbox" id="tk_${tk.id}" data-c="toggleTask" data-t="${tk.id}" ${tk.done ? 'checked' : ''} ${future || readOnly ? 'disabled' : ''}>

          <button class="link" data-c="delTask" data-t="${tk.id}">删</button></div>`;
      }).join('') || '<div class="note">还没有任务。至少写一条，任务全部勾完才算达成。</div>'}
      ${date >= t ? `<form class="taskadd" id="taskForm">
        <label for="taskText" class="note">添加任务</label>
        <input id="taskText" maxlength="200" placeholder="例如：做完手册练习 4.1、4.2" required>
        <select id="taskCh" aria-label="关联章节"><option value="">不关联章节</option>${chapterOpts}</select>
        <div class="qbar"><button class="ghost">＋ 添加任务</button>${sample ? '<button type="button" class="ai" data-c="suggest">✨ Claude 建议任务</button>' : ''}</div>
      </form>` : ''}
    </div>
    <div class="card"><h2>③ 每日测验 ${pill(s.quizOk)}</h2>
      <div class="note">先勾完任务再考：Claude 只针对已勾完的任务现场出 ${settings.quizCount} 道新题并逐题批改，判对 ${settings.quizPass} 道及以上算通过，“部分正确”不算对。没过可以重考，每次换一批新题。答错的题会收进对应章节的题库。</div>
      ${attempts.filter(a => a.done).map((a, i) => `<div class="split"><span>第 ${i + 1} 次 · ${esc(a.at)}</span><b style="color:${a.passed ? 'var(--green1)' : 'var(--red)'}">${a.right} / ${a.items.length} ${a.passed ? '通过' : '未通过'}</b></div>`).join('')}
      <div class="qbar">${isToday
        ? sample
          ? `<button class="${s.quizOk ? 'ghost' : 'ai'}" data-c="quiz" ${readOnly ? 'disabled' : ''}>${inProgress ? '继续测验' : s.quizOk ? '再考一次' : attempts.length ? '重考（换一批新题）' : '开始测验'}</button>`
          : '<span class="note">每日测验需要 Claude：请在 claude.ai 登录后打开本页，并允许它使用 Claude。</span>'
        : future ? '<span class="note">测验当天才能开始。</span>' : ''}</div>
    </div>
  </div>`;
}

$('#calView').addEventListener('click', e => {

  if (act === 'toggleTask') return; // 交给 change 处理
  if (act === 'prev' || act === 'next') {
    const [y, m] = calMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + (act === 'next' ? 1 : -1), 1);
    calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  if (act === 'today') { calSel = today(); calMonth = calSel.slice(0, 7); }
  if (act === 'sel') { calSel = b.dataset.date; calMonth = calSel.slice(0, 7); }
  if (act === 'goLib') return setView('lib');
  if (act === 'delTask') {
    if (readOnly) return;
    const d = days[calSel]; if (!d) return;
    const was = dayStatus(calSel).passed;
    d.tasks = d.tasks.filter(x => x.id !== b.dataset.t); saveDay(d); celebrate(calSel, was);
  }

});
$('#calView').addEventListener('change', e => {

$('#calView').addEventListener('submit', e => {

// ---------- 每日测验 ----------
let dq = null; // {date, status: 'generating'|'answer'|'grading'|'error', error, ctl, draft, review}
const curAttempt = () => { const a = days[dq?.date]?.attempts; return a?.[a.length - 1]; };

function quizScope(date) {
  const tasks = dayStatus(date).tasks;
  const link = ts => ts.map(t => { const g = game(t.gameId); return { g, c: chapter(g, t.chapterId) }; }).filter(x => x.c);
  const done = link(tasks.filter(t => t.done)), all = link(tasks);
  const scope = done.length ? done : all.length ? all : games.flatMap(g => { const cur = g.chapters.find(c => !c.done); return cur ? [{ g, c: cur }] : []; });
  const seen = new Set();
  return scope.filter(x => !seen.has(x.c.id) && seen.add(x.c.id));
}

function startDaily(date) {
  if (readOnly || !db || !sample) return;
  const last = days[date]?.attempts?.at(-1);
  dq = { date, status: last && !last.done ? 'answer' : 'generating', error: '', ctl: null, draft: '', review: null };
  $('#dqDlg').showModal();
  if (dq.status === 'generating') genDaily(); else renderDaily();
}

async function genDaily() {
  const token = dq, date = dq.date;
  const s = dayStatus(date), scope = quizScope(date);
  const ctl = new AbortController();
  Object.assign(dq, { status: 'generating', error: '', ctl, review: null });
  renderDaily();
  const list = scope.map((x, i) => `C${i}: ${x.g.name} / ${x.c.name}`).join('\n') || '（暂无章节，就按任务内容出题）';
  const doneTasks = s.tasks.filter(t => t.done).map(t => '- ' + t.text).join('\n');
  const todoTasks = s.tasks.filter(t => !t.done).map(t => '- ' + t.text).join('\n');
  const existing = scope.flatMap(x => x.c.questions.map(q => '- ' + q.q.replace(/\n/g, ' '))).slice(0, 60).join('\n') || '（暂无）';
  try {
    const r = await sample.json(
`你是一位严格但友善的出题老师。学习者背景：10 年 Java 后端工程师，正在转型大模型后训练 / RL 系统方向，同时在读 AI 在职硕士。

这是学习者今天的每日测验，用来检验他今天是否真的掌握了所学内容。

今天已经完成的任务（只考这些内容）：
${doneTasks || '（还没有勾选完成的任务）'}

今天还没完成的任务（还没学，不要考）：
${todoTasks || '（无）'}

可出题的章节（每道题用编号标出它属于哪一章）：
${list}

题库里已有的题（不要重复，也不要换个说法重复）：
${existing}

请出 ${settings.quizCount} 道新题。
要求：
- 只考“已经完成的任务”里实际学到的小节；同一章里还没学到的小节一律不要考，不要超前。没有已完成任务时，只考这些章节最开头、最基础的内容。
- 简答题，1 到 3 分钟内能用几句话、一个式子或一个形状答出。
- 优先考“结果的形状 / 数值是多少 / 每个位置从哪来 / 为什么”，少考纯名词记忆。
- 不要出需要写完整代码的题；需要时可以在题目里给出几行代码让学习者推结果。
- 参考答案简洁准确，1 到 3 句。拿不准的知识点不要出。
- 用中文，代码和张量写法保持原样。

只回复一个 JSON 数组：[{"q": "题目", "a": "参考答案", "ref": "C0"}, ...]`,
      { signal: ctl.signal, cache: false });
    if (dq !== token) return;
    const items = (Array.isArray(r) ? r : []).filter(x => x && typeof x.q === 'string' && typeof x.a === 'string' && x.q.trim())
      .slice(0, settings.quizCount)
      .map(x => {
        const sc = scope[parseInt(String(x.ref ?? '').replace(/\D/g, ''), 10)] || scope[0];
        return { q: x.q.trim(), a: x.a.trim(), gameId: sc?.g.id || null, chapterId: sc?.c.id || null, answer: '', verdict: null, feedback: '' };
      });
    if (!items.length) throw { code: 'invalid_json' };
    const d = ensureDay(date);
    d.attempts.push({ id: uid(), at: new Date().toTimeString().slice(0, 5), items, done: false, right: 0, passed: false });
    saveDay(d);
    Object.assign(dq, { status: 'answer', ctl: null });
  } catch (e) {
    if (dq !== token) return;
    if (e?.code === 'cancelled') return closeDaily();
    Object.assign(dq, { status: 'error', error: sampleErr(e), ctl: null });
    hideSampleIfDenied(e);
  }
  renderDaily();
}

function finishAttempt(d, a) {
  const was = dayStatus(d.date).passed;
  a.done = true;
  a.right = a.items.filter(x => x.verdict === 'right').length;
  a.passed = a.right >= Math.ceil(settings.quizPass / settings.quizCount * a.items.length);
  const touched = new Set();
  for (const it of a.items) {
    if (it.verdict === 'right') continue;
    const g = game(it.gameId), c = chapter(g, it.chapterId);
    if (!c) continue;
    c.questions.push({ id: uid(), q: it.q, a: it.a, by: 'claude', right: 0, wrong: 1 });
    touched.add(g);
  }
  touched.forEach(saveGame);
  saveDay(d);
  if (a.passed) toast('📅', '每日测验通过', `${a.right} / ${a.items.length}`);
  celebrate(d.date, was);
}

function renderDaily() {
  if (!dq) return;
  const body = $('#dqBody');
  const head = `<div class="qhead"><span>📅 每日测验 · ${esc(dq.date)}</span>`;
  if (dq.status === 'generating') {
    body.innerHTML = `${head}</div><p>Claude 正在根据今天的任务出 ${settings.quizCount} 道题，通常要十几秒到一分钟…</p>
      <div class="row"><button class="link" data-d="close">取消</button></div>`;
    return;
  }
  const a = curAttempt();
  if (dq.status === 'error' && (!a || a.done)) {
    body.innerHTML = `${head}</div><p class="err">${esc(dq.error)}</p>
      <div class="row"><button class="link" data-d="close">关闭</button><button class="ai" data-d="regen">再试一次</button></div>`;
    return;
  }
  if (!a) return closeDaily();
  const dots = a.items.map((it, i) => `<i class="${it.verdict === 'right' ? 'r' : it.verdict ? 'w' : i === (dq.review ?? a.items.findIndex(x => !x.verdict)) ? 'c' : ''}"></i>`).join('');
  const nextIdx = a.items.findIndex(x => !x.verdict);

  if (dq.review == null && (nextIdx < 0 || a.done)) {
    const wrong = a.items.length - a.right;
    body.innerHTML = `${head}</div><div class="qdots">${dots}</div>
      <div class="result"><div class="big">${a.passed ? '📅' : '💀'}</div>
        <h3>${a.passed ? '每日测验通过' : '这次没过'}</h3>
        <p>Claude 判对 ${a.right} / ${a.items.length} 题${a.passed ? '' : `，需要 ${Math.ceil(settings.quizPass / settings.quizCount * a.items.length)} 题`}。${wrong ? `答错的 ${wrong} 题已收进题库。` : ''}</p></div>
      <div class="row"><button class="${a.passed ? 'ok' : 'link'}" data-d="close">${a.passed ? '好的' : '先去复习'}</button>${a.passed ? '' : '<button class="ai" data-d="retry">重考（换一批新题）</button>'}</div>`;
    return;
  }

  const i = dq.review ?? nextIdx;
  const it = a.items[i];
  const g = game(it.gameId), c = chapter(g, it.chapterId);
  const reviewing = dq.review != null;
  const verdictText = { right: '判对', partial: '部分正确（不算对）', wrong: '判错' };
  body.innerHTML = `${head}<span>${i + 1} / ${a.items.length}</span></div>
    <div class="qdots">${dots}</div>
    <div class="qtext">${esc(it.q)}</div>
    <div class="qsrc">${c ? `出自：${esc(g.name)} / ${esc(c.name)}` : '出自：今天的任务'}</div>
    <label for="dqDraft" style="margin-top:14px">写下你的答案，提交后由 Claude 批改</label>
    <textarea id="dqDraft" rows="4" ${reviewing || dq.status === 'grading' ? 'readonly' : ''}>${esc(reviewing ? it.answer : dq.draft)}</textarea>
    ${dq.status === 'grading' ? '<div class="qai"><b>Claude 批改</b>Claude 思考中… <button class="link" data-d="stop">停止</button></div>' : ''}
    ${dq.error && dq.status !== 'grading' ? `<p class="err">${esc(dq.error)}</p>` : ''}
    ${reviewing ? `<div class="qai"><b>Claude 批改 · <span class="verdict ${it.verdict}">${verdictText[it.verdict]}</span></b>${esc(it.feedback)}</div>
      <div class="qans"><b>参考答案</b>${esc(it.a)}</div>` : ''}
    <div class="row">
      <button class="link" data-d="close" style="margin-right:auto">稍后继续</button>
      ${reviewing
        ? `<button class="ok" data-d="next">${a.items.every(x => x.verdict) ? '看结果' : '下一题'}</button>`
        : `<button class="ai" data-d="grade" ${dq.status === 'grading' ? 'disabled' : ''}>提交给 Claude 批改</button>`}
    </div>`;
  if (!reviewing && dq.status !== 'grading') setTimeout(() => $('#dqDraft')?.focus(), 0);
}

async function gradeDaily() {
  const a = curAttempt();
  const i = a.items.findIndex(x => !x.verdict);
  const it = a.items[i];
  const answer = $('#dqDraft').value.trim();
  dq.draft = $('#dqDraft').value;
  if (!answer) { dq.error = '先写下你的答案，再提交批改。'; renderDaily(); return; }
  const ctl = new AbortController(), token = dq;
  Object.assign(dq, { status: 'grading', error: '', ctl });
  renderDaily();
  try {
    const g = game(it.gameId), c = chapter(g, it.chapterId);
    const r = await claudeGrade({ subject: g?.name || '今天的任务', chapter: c?.name || '—', q: it.q, a: it.a, answer, signal: ctl.signal });
    if (dq !== token) return;
    if (!r.verdict) throw { code: 'invalid_json' };
    const d = days[dq.date], cur = d.attempts[d.attempts.length - 1];
    Object.assign(cur.items[i], { answer, verdict: r.verdict, feedback: r.feedback });
    if (cur.items.every(x => x.verdict)) finishAttempt(d, cur); else saveDay(d);
    Object.assign(dq, { review: i, draft: '' });
  } catch (e) {
    if (dq !== token) return;
    dq.error = e?.code === 'cancelled' ? '' : sampleErr(e);
    hideSampleIfDenied(e);
  }
  Object.assign(dq, { status: 'answer', ctl: null });
  renderDaily();
}

function closeDaily() { dq?.ctl?.abort(); dq = null; if ($('#dqDlg').open) $('#dqDlg').close(); render(); }

$('#dqBody').addEventListener('click', e => {
  const act = e.target.closest('[data-d]')?.dataset.d; if (!act || !dq) return;
  if (act === 'grade') return gradeDaily();
  if (act === 'stop') return dq.ctl?.abort();
  if (act === 'next') { dq.review = null; dq.error = ''; return renderDaily(); }
  if (act === 'retry' || act === 'regen') return genDaily();
  if (act === 'close') return closeDaily();
});
$('#dqDlg').addEventListener('cancel', e => { e.preventDefault(); closeDaily(); });

// ---------- Claude 建议任务 ----------
let ts = null; // {date, status, items, error, ctl}

function openSuggest(date) {

}

function renderSuggest() {

async function runSuggest() {
  const token = ts, date = ts.date;

  renderSuggest();
  const { refs, progress } = chapterProgress();

    const r = await sample.json(
`你在帮一位在职学习者安排 ${date}（周${WEEK[weekday(date)]}）的学习任务。学习者背景：10 年 Java 后端工程师，转型大模型后训练 / RL 系统方向，在读 AI 在职硕士。当天目标学习 ${fmtH(dayStatus(date).target)} 小时。

各科章节进度（编号用于标注任务属于哪一章）：
${progress}

最近 7 天的练习：
${recent}

当天已经写好的任务（不要重复）：
${existing}

请建议 3 到 5 条具体任务，加起来大约填满当天目标时长。
要求：
- 每条都要具体、可勾选完成，例如“做完第 4 章练习 4.1、4.2，并用小例子手算验证”，不要写“学习第 4 章”这种空话。
- 按进度推进：优先当前未完成的章节，可以安排一条复习答错多的题。
- 每条估一个分钟数。
- 用中文。

只回复一个 JSON 数组：[{"text": "任务内容", "minutes": 60, "ref": "C3"}]，ref 不属于任何章节时写 null。`,
      { signal: ctl.signal, cache: false });
    if (ts !== token) return;
    const items = (Array.isArray(r) ? r : []).filter(x => x && typeof x.text === 'string' && x.text.trim()).slice(0, 6).map(x => {
      const ref = x.ref == null ? null : refs[parseInt(String(x.ref).replace(/\D/g, ''), 10)];

    });
    Object.assign(ts, { status: items.length ? 'idle' : 'error', error: items.length ? '' : 'Claude 没给出可用的任务，再试一次。', items, ctl: null });
  } catch (e) {
    if (ts !== token) return;
    Object.assign(ts, { status: e?.code === 'cancelled' ? 'idle' : 'error', error: sampleErr(e), ctl: null });

}

$('#tsBody').addEventListener('click', e => {

$('#tsBody').addEventListener('change', e => {

// ---------- 周计划：复盘这周，排下周 ----------
// 一次排一周（周一到周六）。没勾完的任务优先补；落后就放慢，超前就推进。复盘说明存在 weeks/<下周一>。
let weeks = {};
const mondayOf = date => addDays(date, -((weekday(date) + 6) % 7));
const weekDates = monday => Array.from({ length: 7 }, (_, i) => addDays(monday, i));
let wp = null; // {from, to, status, hint, review, days: [{date, tasks: [{text, gameId, chapterId, pick}]}], error, ctl}

function chapterProgress() {
  const refs = games.flatMap(g => g.chapters.map(c => ({ g, c })));
  const progress = games.map(g => {
    const chs = g.chapters.map(c => `  C${refs.findIndex(r => r.c === c)}: ${c.name}（${c.done ? '已完成' : '未完成'}，题库 ${c.questions.length} 题，答错多的 ${c.questions.filter(q => q.wrong > q.right).length} 题）`).join('\n');
    return `${g.name}：\n${chs || '  （还没有章节）'}`;
  }).join('\n');
  return { refs, progress };
}

function weekSummary(monday) {
  return weekDates(monday).map(date => {
    const s = dayStatus(date);
    const head = `${date}（周${WEEK[weekday(date)]}）`;
    if (s.rest) return `${head}：主日`;
    const at = (days[date]?.attempts || []).filter(a => a.done);
    const best = at.reduce((b, a) => Math.max(b, a.right), 0);
    const tasks = s.tasks.map(t => {
      const g = game(t.gameId), c = chapter(g, t.chapterId);
      return `    [${t.done ? '✓' : ' '}] ${t.text}${c ? `（${g.name} / ${c.name}）` : ''}`;
    }).join('\n') || '    （没有任务）';
    return `${head}${date > today() ? '【还没到】' : ''}：时长 ${fmtH(s.minutes)}/${fmtH(s.target)}h；测验${at.length ? `考了 ${at.length} 次，最好 ${best}/${settings.quizCount}，${s.quizOk ? '通过' : '未通过'}` : '没考'}；${s.passed ? '通关' : '未通关'}\n${tasks}`;
  }).join('\n');
}

function openPlan(date) {
  const from = mondayOf(date);
  wp = { from, to: addDays(from, 7), status: 'idle', hint: '', review: '', days: [], error: '', ctl: null };
  renderPlan();
  $('#wpDlg').showModal();
}

function renderPlan() {
  if (!wp) return;
  const md = d => `${+d.slice(5, 7)} 月 ${+d.slice(8)} 日`;
  const refName = t => { const g = game(t.gameId), c = chapter(g, t.chapterId); return c ? `${g.name} / ${c.name}` : ''; };
  const picked = wp.days.reduce((a, d) => a + d.tasks.filter(t => t.pick).length, 0);
  $('#wpBody').innerHTML = `
    <h2>✨ 复盘这周，排下周</h2>
    <p class="note">复盘 ${md(wp.from)} 这一周的完成情况，排 ${md(wp.to)} 起的周一到周六。周日是主日，不排任务。</p>
    <label for="wpHint">补充说明（可空）</label>
    <input id="wpHint" maxlength="300" value="${esc(wp.hint)}" placeholder="例如：周三要加班，只能学 1 小时；第 4 章还是没吃透" ${wp.status === 'loading' ? 'readonly' : ''}>
    ${wp.status === 'loading' ? '<p class="note">Claude 正在复盘并排计划，通常要半分钟到一两分钟… <button class="link" data-w="stop">停止</button></p>' : ''}
    ${wp.status === 'error' ? `<p class="err">${esc(wp.error)}</p>` : ''}
    ${wp.review ? `<div class="qai"><b>本周复盘</b>${esc(wp.review)}</div>` : ''}
    ${wp.days.map((d, di) => `
      <h3 class="wpday">${md(d.date)} · 周${WEEK[weekday(d.date)]}<span class="note">${fmtH(d.tasks.filter(t => t.pick).reduce((a, t) => a + (t.minutes || 0), 0))} h</span></h3>
      ${d.tasks.map((t, ti) => `
        <label class="cand" for="wp_${di}_${ti}" style="margin:0 0 6px"><input type="checkbox" id="wp_${di}_${ti}" data-di="${di}" data-ti="${ti}" ${t.pick ? 'checked' : ''}>
          <span><div class="q">${esc(t.text)}</div>${refName(t) ? `<div class="a">${esc(refName(t))}</div>` : ''}</span></label>`).join('') || '<p class="note">这天没有安排。</p>'}`).join('')}
    <div class="row">
      <button class="link" data-w="close" style="margin-right:auto">关闭</button>
      <button class="ai" data-w="run" ${wp.status === 'loading' ? 'disabled' : ''}>${wp.days.length ? '重新排' : '开始复盘'}</button>
      ${wp.days.length ? `<button class="ok" data-w="save" ${picked ? '' : 'disabled'}>写入日历（${picked} 条）</button>` : ''}
    </div>`;
}

async function runPlan() {
  const token = wp;
  wp.hint = $('#wpHint').value.trim();
  const ctl = new AbortController();
  Object.assign(wp, { status: 'loading', error: '', ctl });
  renderPlan();
  const { refs, progress } = chapterProgress();
  const dates = weekDates(wp.to).filter(d => !isRest(d));
  const existing = dates.flatMap(d => (days[d]?.tasks || []).map(t => `- ${d}：${t.text}`)).join('\n') || '（暂无）';
  try {
    const r = await sample.json(
`你是学习者的学习教练，按“打游戏做任务”的方式排周计划：每天是一个关卡，任务要具体、可勾选，完成情况决定下周怎么调。
学习者背景：10 年 Java 后端工程师，在职转型大模型后训练 / RL 系统方向，在读 AI 在职硕士。每天的目标时长：${targetDesc()}；周日是主日，要敬拜，绝不安排学习。

这一周（${wp.from} 起）的完成情况（[✓] 已完成，[ ] 没完成）：
${weekSummary(wp.from)}

各科章节进度（编号用于标注任务属于哪一章）：
${progress}

下周已经写好的任务（不要重复）：
${existing}
${wp.hint ? '\n学习者补充：' + wp.hint + '\n' : ''}
请先写一段复盘（3 到 5 句：完成了什么、没完成什么、可能的原因、下周节奏怎么调），再排下周每天的任务。
规则：
- 这周没勾完的任务优先安排，必要时拆小。
- 这周时长或任务明显没完成时，下周要放慢，不要把欠下的全部堆上去；完成得好就往前推进。
- 每天任务加起来约等于当天目标时长，每条估一个分钟数。
- 每条具体到小节或练习编号，例如“做完第 4 章练习 4.1、4.2，并用小例子手算验证”，不要写“学习第 4 章”这种空话。
- 测验没通过或答错多的章节，安排复习或 Boss 战。
- 只排这些日期：${dates.join('、')}
- 用中文。

只回复一个 JSON 对象：{"review": "复盘", "days": [{"date": "YYYY-MM-DD", "tasks": [{"text": "任务", "minutes": 60, "ref": "C3"}]}]}，ref 不属于任何章节时写 null。`,
      { signal: ctl.signal, cache: false });
    if (wp !== token) return;
    const planDays = dates.map(date => {
      const src = (Array.isArray(r?.days) ? r.days : []).find(d => d?.date === date);
      const tasks = (Array.isArray(src?.tasks) ? src.tasks : []).filter(t => t && typeof t.text === 'string' && t.text.trim()).slice(0, 8).map(t => {
        const ref = t.ref == null ? null : refs[parseInt(String(t.ref).replace(/\D/g, ''), 10)];
        const minutes = Math.max(0, Math.round(+t.minutes) || 0);
        return { text: t.text.trim() + (minutes ? `（约 ${minutes} 分钟）` : ''), minutes, gameId: ref?.g.id || null, chapterId: ref?.c.id || null, pick: true };
      });
      return { date, tasks };
    });
    const ok = planDays.some(d => d.tasks.length);
    Object.assign(wp, { status: ok ? 'idle' : 'error', error: ok ? '' : 'Claude 没排出可用的计划，再试一次。', review: String(r?.review || ''), days: ok ? planDays : [], ctl: null });
  } catch (e) {
    if (wp !== token) return;
    Object.assign(wp, { status: e?.code === 'cancelled' ? 'idle' : 'error', error: sampleErr(e), ctl: null });
    hideSampleIfDenied(e);
  }
  if (wp === token) renderPlan();
}

$('#wpBody').addEventListener('click', e => {
  const act = e.target.closest('[data-w]')?.dataset.w; if (!act || !wp) return;
  if (act === 'run') return runPlan();
  if (act === 'stop') return wp.ctl?.abort();
  if (act === 'close') { wp.ctl?.abort(); wp = null; $('#wpDlg').close(); return; }
  if (act === 'save') {
    if (readOnly || !db) return;
    for (const d of wp.days) {
      const picked = d.tasks.filter(t => t.pick);
      if (!picked.length) continue;
      const day = ensureDay(d.date);
      for (const t of picked) day.tasks.push({ id: uid(), text: t.text, gameId: t.gameId, chapterId: t.chapterId, done: false });
      saveDay(day);
    }
    if (wp.review) {
      const doc = { review: wp.review, from: wp.from, createdAt: today() };
      weeks[wp.to] = doc;
      put('weeks/' + wp.to, () => clone(doc));
    }
    toast('🗓', '下周计划已写入日历', `${wp.to} 起`);
    calSel = wp.to; calMonth = wp.to.slice(0, 7);
    wp = null; $('#wpDlg').close(); render();
  }
});
$('#wpBody').addEventListener('change', e => {
  if (e.target.dataset.di == null || !wp) return;
  wp.days[+e.target.dataset.di].tasks[+e.target.dataset.ti].pick = e.target.checked;
  renderPlan();
});
$('#wpDlg').addEventListener('cancel', e => { e.preventDefault(); wp?.ctl?.abort(); wp = null; $('#wpDlg').close(); });

document.querySelector('nav').addEventListener('click', e => { const v = e.target.closest('[data-view]')?.dataset.view; if (v) setView(v); });

// ---------- boot ----------
render();
(async () => {
  const use = n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  [db, sample, downloads] = await Promise.all([use('db'), use('sample'), use('downloads')]);
  if (!db) {
    loaded.games = true;
    showBanner('读不到云端存档。请登录 claude.ai 后在这里打开这个页面。');
    $('#syncNote').textContent = '云端存档不可用';
    render(); return;
  }
  db.collection('games').onSnapshot(snap => {
    games = snap.docs.map(d => ({ id: d.id, dlcs: [], chapters: [], ...clone(d.data()) }));
    for (const g of games) for (const c of g.chapters) c.questions = c.questions || [];
    loaded.games = true;
    render();
  }, e => showBanner('云端存档连接中断（' + e.code + '），刷新页面重试。'));
  db.collection('days').onSnapshot(snap => {
    days = Object.fromEntries(snap.docs.map(d => [d.id, { tasks: [], attempts: [], ...clone(d.data()), date: d.id }]));
    render();
  }, e => showBanner('日历存档连接中断（' + e.code + '），刷新页面重试。'));
  db.collection('weeks').onSnapshot(snap => {
    weeks = Object.fromEntries(snap.docs.map(d => [d.id, clone(d.data())]));
    render();
  }, () => {});
  db.doc('meta/settings').onSnapshot(snap => {
    settings = snap.exists ? { ...clone(DEFAULT_SETTINGS), ...clone(snap.data()) } : clone(DEFAULT_SETTINGS);
    loaded.settings = true;
    render();
  }, () => {});
})();
</script>
